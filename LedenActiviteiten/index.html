<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steenbrugge Activiteiten</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login" v-show="state.currentView === 'login' || state.currentView === 'loading'">
      <a href="#" id="loginBackButton" @click.prevent="goBack" v-show="!isLoginMode">Naar Log in</a>
      
      <h1 id="loginTitle" class="text-center mb-4">
        <template v-if="isLoginMode">Steenbrugge<br>Activiteiten<br>Log in</template>
        <template v-else-if="state.send"><br><br>Paswoord vergeten</template>
        <template v-else-if="state.makeAccount"><br><br>Account aanmaken</template>
      </h1>

      <label id="emailLabel" class="form-label">Email</label>
      <input id="emailInput" type="email" class="form-control mb-2" v-model="loginEmail" :disabled="loading">
      
      <label id="passwordLabel" class="form-label" v-show="isLoginMode">Password</label>
      <input id="passwordInput" type="password" class="form-control mb-2" v-model="loginPassword" v-show="isLoginMode" :disabled="loading">
      
      <label id="usernameLabel" class="form-label" v-show="state.makeAccount && !isLoginMode">Naam</label>
      <input id="usernameInput" type="text" class="form-control mb-2" v-show="state.makeAccount && !isLoginMode" v-model="username" :disabled="loading">

      <button id="inlogButton" class="btn btn-primary w-100 mb-2" @click="handleLogin" v-show="isLoginMode" :disabled="loading">
        <span v-if="loading">Bezig...</span><span v-else>Log in</span>
      </button>
      
      <a href="#" id="forgotPassword" class="text-center mb-2 d-block" @click.prevent="handleForgotPassword" v-show="isLoginMode && !state.send">Paswoord vergeten</a>
      <a href="#" id="register" class="text-center mb-2 d-block" @click.prevent="handleRegister" v-show="isLoginMode && !state.makeAccount">Registreren</a>

      <button class="btn btn-success w-100 mb-2" @click="handleForgotPassword" v-show="!isLoginMode && state.send">Verzend email</button>
      <button class="btn btn-success w-100 mb-2" @click="handleRegister" v-show="!isLoginMode && state.makeAccount">Account maken</button>

      <div v-if="error" class="alert alert-danger mt-3">{{ error }}</div>
    </div>
    
    <span id="loadingText" v-show="state.currentView === 'loading'">loading...</span>

    <!-- Main Screen -->
    <div class="container main-container" id="main" v-show="state.currentView === 'main'">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div id="score_edit">
          <button id="editButton" class="btn btn-warning mb-2" @click="toggleEdit" v-show="state.data && !state.data.readOnly">
            {{ state.bulletsDisabled ? 'Wijzigen' : 'Stop wijzigen' }}
          </button>
          <div id="score" class="fw-bold">Aanwezig: /</div>
        </div>
        
        <div id="logOut_email" class="text-end">
          <button id="logOutButton" class="btn btn-danger mb-2" @click="logout">Log Out</button>
          <div id="email" class="small">{{ state.email }}</div>
        </div>
      </div>

      <div class="form-check mb-3 position-absolute" style="left: 10px; top: 12vh;">
        <input class="form-check-input" type="checkbox" id="toonAllesInput" v-model="toonAlles" @change="toggleToonAlles">
        <label class="form-check-label" for="toonAllesInput">Toon alles</label>
      </div>

      <div id="breaksForMobile" class="d-none d-lg-block"><br></div>

      <div class="header text-center mb-4" id="mainTitle">
        <h1 id="title">Activiteiten</h1>
      </div>

      <div class="events" id="events">
        <!-- Header row (empty + option labels) -->
        <div class="event-header d-none d-md-grid grid-cols-6 gap-2">
          <div></div>
          <span v-for="(label, idx) in OPTION_LABELS" :key="idx" v-html="label"></span>
        </div>
        
        <!-- Event rows -->
        <a 
          v-for="(event, idx) in visibleEvents()" 
          :key="idx"
          class="event-title"
          href="#"
          @click.prevent="openEvent(idx)"
        >
          {{ event.replaceAll('\n', '<br>') }}
        </a>
        
        <!-- Radio groups per event -->
        <div 
          v-for="(event, eventIdx) in visibleEvents()" 
          :key="eventIdx"
          v-for="(option, optIdx) in OPTIONS"
          :key="'opt-' + eventIdx + '-' + optIdx"
          class="radio-group"
        >
          <input 
            type="radio" 
            :name="'event' + event.replaceAll('\n', '\\n')" 
            :value="option"
            :checked="state.data && state.data.userData[visibleEvents().indexOf(event)] === option"
            :disabled="!state.data || state.data.readOnly || state.bulletsDisabled"
            @change="handleRadioChange(event, option)"
          >
        </div>
      </div>
    </div>
  </div>

  <script>
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register('sw.js', { scope: '.' }).catch(console.error);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.0/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="script/main.js"></script>
</body>
</html>
