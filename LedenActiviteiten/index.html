<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swipe Cards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="/img/icon.png">
  <script>
    // set theme before first paint (no flash)
    try {
      const t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-bs-theme', t);
    } catch (e) {}
  </script>
</head>
<body class="bg-body overflow-hidden vh-100">
  <div class="stage position-fixed top-0 start-0 w-100 h-100 user-select-none" id="stage">

    <!-- Card 1: overview (event cards are generated in script.js) -->
    <div class="swipe-card card position-absolute top-50 start-50 shadow-lg rounded-4 border border-warning">
      <div class="card-header top-bar">
        <div class="row align-items-center h-100">
          <div class="col-3">
            <button class="btn btn-warning btn-sm" id="editButton" aria-label="Edit"><i class="bi bi-pencil-fill"></i></button>
          </div>
          <div class="col-6 text-center">
            <h4 class="m-0 text-warning-emphasis fw-bold text-truncate" id="title">...</h4>
          </div>
          <div class="col-3 text-end">
            <button class="btn btn-warning btn-sm" id="logOutButton" aria-label="Log out"><i class="bi bi-box-arrow-right"></i></button>
          </div>
        </div>
      </div>

      <div class="card-body overflow-auto">
        <div class="d-flex justify-content-between small mb-3">
          <span class="text-success" id="count"></span>
          <span class="text-warning-emphasis" id="email"></span>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="showAll">
          <label class="form-check-label text-warning-emphasis" for="showAll">Toon alles</label>
        </div>

        <table class="table align-middle text-center mb-0">
          <thead>
            <tr>
              <th></th>
              <th class="fs-5 text-success" title="Aanwezig" aria-label="Aanwezig"><i class="bi bi-check-circle-fill"></i></th>
              <th class="fs-5 text-success" title="Waarschijnlijk aanwezig" aria-label="Waarschijnlijk aanwezig"><i class="bi bi-check-circle"></i></th>
              <th class="fs-5 text-secondary" title="Geen idee" aria-label="Geen idee"><i class="bi bi-question-circle"></i></th>
              <th class="fs-5 text-warning-emphasis" title="Waarschijnlijk afwezig" aria-label="Waarschijnlijk afwezig"><i class="bi bi-x-circle"></i></th>
              <th class="fs-5 text-danger" title="Afwezig" aria-label="Afwezig"><i class="bi bi-x-circle-fill"></i></th>
            </tr>
          </thead>
          <tbody id="events">
            <tr><td colspan="6" class="text-secondary">Laden...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <div class="position-fixed bottom-0 start-0 end-0 d-flex justify-content-center gap-2 pb-3" id="dots"></div>
  <script type="module" src="script.js"></script>
</body>
</html>
