<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageTitle">Activiteiten · Muziekvereniging Steenbrugge</title>
  <meta name="description" data-i18n-content="metaDescription" content="Komende concerten en activiteiten van Muziekvereniging Steenbrugge.">
  <link rel="icon" type="image/png" href="../img/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header" id="header">
      <p class="eyebrow">Muziekvereniging Steenbrugge</p>
      <h1 data-i18n="heading">Activiteiten</h1>
    </header>

    <div id="list" class="list" aria-live="polite" aria-busy="true">
      <div class="activity skeleton" aria-hidden="true"></div>
      <div class="activity skeleton" aria-hidden="true"></div>
      <div class="activity skeleton" aria-hidden="true"></div>
    </div>

    <p class="more" id="more" hidden>
      <a id="moreLink" href="./" target="_blank" rel="noopener" data-i18n="seeAll"></a>
    </p>
  </main>

  <template id="activityTemplate">
    <article class="activity">
      <time class="date" data-date>
        <span class="weekday" data-weekday></span>
        <span class="day" data-day></span>
        <span class="month" data-month></span>
      </time>
      <div class="body">
        <h3 class="title" data-title></h3>
        <p class="meta">
          <span data-time></span>
          <a class="location" data-location target="_blank" rel="noopener">
            <svg aria-hidden="true" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 0a5.5 5.5 0 0 0-5.5 5.5C2.5 9.6 8 16 8 16s5.5-6.4 5.5-10.5A5.5 5.5 0 0 0 8 0Zm0 7.8a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6Z"/></svg>
            <span data-location-text></span>
          </a>
        </p>
        <div class="description" data-description></div>
        <a class="add-to-calendar" data-calendar target="_blank" rel="noopener">
          <svg aria-hidden="true" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M4 0h1.5v2h5V0H12v2h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h2V0ZM2.5 6v8.5h11V6h-11Zm5 1.5H9v2h2V11H9v2H7.5v-2h-2V9.5h2v-2Z"/></svg>
          <span data-i18n="addToCalendar"></span>
        </a>
      </div>
    </article>
  </template>

  <script type="module" src="script.js"></script>
</body>
</html>
