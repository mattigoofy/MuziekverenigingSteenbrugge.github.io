<!DOCTYPE html>
<html lang="nl" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageTitle">Activiteiten Steenbrugge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../img/icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="bg-body overflow-hidden vh-100">
  <div class="stage position-fixed top-0 start-0 w-100 h-100 user-select-none" id="stage">

    <!-- Card 1: overview (event cards are generated in script.js) -->
    <div class="swipe-card card position-absolute top-50 start-50 shadow-lg rounded-4 border border-warning">
      <div class="card-header top-bar">
        <div class="d-flex align-items-center gap-2 h-100">
          <div class="top-side">
            <button class="btn btn-warning btn-sm" id="editButton" data-i18n-aria-label="edit" data-i18n-title="edit"><i class="bi bi-pencil-fill"></i></button>
          </div>
          <h4 class="top-title m-0 text-warning-emphasis fw-bold" id="title">...</h4>
          <div class="top-side text-end">
            <button class="btn btn-warning btn-sm" id="logOutButton" data-i18n-aria-label="logOut" data-i18n-title="logOut"><i class="bi bi-box-arrow-right"></i></button>
          </div>
        </div>
      </div>

      <div class="card-body overflow-auto">
        <div class="d-flex justify-content-between small mb-3">
          <span class="text-success" id="count"></span>
          <span class="text-warning-emphasis" id="email"></span>
        </div>
        <div class="small text-warning mb-2 d-none" id="status"></div>
        <div class="small mb-2 d-none" id="calendarRow">
          <a class="text-warning-emphasis" id="calendarLink" href="#" data-i18n-title="calendarSubscribeTitle"><i class="bi bi-calendar-event"></i> <span data-i18n="calendarSubscribe"></span></a>
          <button class="btn btn-link btn-sm p-0 ms-2 align-baseline text-secondary" id="calendarCopy" type="button" data-i18n="calendarCopy"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="form-check m-0">
            <input class="form-check-input" type="checkbox" id="showAll">
            <label class="form-check-label text-warning-emphasis" for="showAll" data-i18n="showAll"></label>
          </div>
          <div data-lang-toggle></div>
        </div>

        <table class="table align-middle text-center mb-0">
          <thead>
            <tr>
              <th></th>
              <th class="fs-5 text-success" data-i18n-title="answer.X" data-i18n-aria-label="answer.X"><i class="bi bi-check-circle-fill"></i></th>
              <th class="fs-5 text-success" data-i18n-title="answer.X?" data-i18n-aria-label="answer.X?"><i class="bi bi-check-circle"></i></th>
              <th class="fs-5 text-secondary" data-i18n-title="answer.?" data-i18n-aria-label="answer.?"><i class="bi bi-question-circle"></i></th>
              <th class="fs-5 text-warning-emphasis" data-i18n-title="answer.O?" data-i18n-aria-label="answer.O?"><i class="bi bi-x-circle"></i></th>
              <th class="fs-5 text-danger" data-i18n-title="answer.O" data-i18n-aria-label="answer.O"><i class="bi bi-x-circle-fill"></i></th>
            </tr>
          </thead>
          <tbody id="events">
            <tr><td colspan="6" class="text-secondary" data-i18n="loading"></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <div class="position-fixed bottom-0 start-0 end-0 d-flex justify-content-center gap-2 pb-3" id="dots"></div>
  <script>
    // no service worker locally: it serves from the cache and so hides your changes
    const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
    if (navigator.serviceWorker && !isLocal) {
      navigator.serviceWorker.register('sw.js', { scope: '.' }).catch(console.error);
    }
    // clean up a service worker that was installed locally earlier
    if (navigator.serviceWorker && isLocal) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
    }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
